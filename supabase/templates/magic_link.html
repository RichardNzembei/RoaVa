<!--
  RoaVa email sign-in — CODE-based, to match the app's 6-digit OTP UI.
  Deliberately NO magic link: the app verifies a typed code (verifyOtp type:"email"),
  and a confirmation link would redirect to "/" with an unhandled ?code= and dead-end.
  Keep {{ .Token }} — that is the 6-digit code the user types in.
-->
<h2 style="margin:0 0 12px;font-weight:500">Your RoaVa sign-in code</h2>
<p style="margin:0 0 16px;color:#241F1C">
  Enter this code to sign in. It expires shortly and can only be used once.
</p>
<p style="margin:0 0 20px;font-size:28px;font-weight:600;letter-spacing:6px;color:#A8482A">
  {{ .Token }}
</p>
<p style="margin:0;color:#6b7280;font-size:13px">
  Didn't request this? You can safely ignore this email.
</p>
